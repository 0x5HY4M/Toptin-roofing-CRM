kind = "web"
previewPath = "/"
title = "Top Tin Roofing CRM"
version = "1.0.0"
id = "artifacts/top-tin-roofing"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21789

[services.development]
run = "pnpm --filter @workspace/top-tin-roofing run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/top-tin-roofing", "run", "build" ]
publicDir = "artifacts/top-tin-roofing/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21789"
BASE_PATH = "/"
