              schema:
                type: array
                items: { $ref: "#/components/schemas/CrewMember" }
    post:
      operationId: createCrewMember
      tags: [crew]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CrewMemberInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CrewMember" }

  /crew/{id}:
    get:
      operationId: getCrewMember
      tags: [crew]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
