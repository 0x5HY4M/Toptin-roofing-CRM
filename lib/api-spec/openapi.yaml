  /dashboard/project-status:
    get:
      operationId: getProjectStatusBreakdown
      tags: [dashboard]
      summary: Project count by status
      responses:
        "200":
          description: Project status breakdown
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/StatusCount" }

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status: { type: string }
      required: [status]

    # ── LEAD ────────────────────────────────────────────────────────────────
    Lead:
      type: object
      required: [id, name, email, phone, stage, priority, source, createdAt, updatedAt]
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string }
        phone: { type: string }
        address: { type: ["string", "null"] }
        roofType: { type: ["string", "null"] }
        squareFootage: { type: ["number", "null"] }
        stage: { type: string }
        priority: { type: string }
        source: { type: string }
        assignedTo: { type: ["string", "null"] }
        notes: { type: ["string", "null"] }
        estimatedValue: { type: ["number", "null"] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    LeadInput:
      type: object
      required: [name, email, phone, stage, priority, source]
      properties:
        name: { type: string, minLength: 1 }
        email: { type: string }
        phone: { type: string }
        address: { type: string }
        roofType: { type: string }
        squareFootage: { type: number }
        stage: { type: string }
        priority: { type: string }
        source: { type: string }
        assignedTo: { type: string }
        notes: { type: string }
        estimatedValue: { type: number }

    LeadUpdate:
      type: object
      properties:
        name: { type: string }
        email: { type: string }
        phone: { type: string }
        address: { type: string }
        roofType: { type: string }
        squareFootage: { type: number }
        stage: { type: string }
        priority: { type: string }
        source: { type: string }
        assignedTo: { type: string }
        notes: { type: string }
        estimatedValue: { type: number }

    LeadStageUpdate:
      type: object
      required: [stage]
      properties:
        stage: { type: string }

    NoteInput:
      type: object
      required: [content]
      properties:
        content: { type: string, minLength: 1 }
        author: { type: string }

    Note:
      type: object
      required: [id, content, createdAt]
      properties:
        id: { type: integer }
        content: { type: string }
        author: { type: ["string", "null"] }
        leadId: { type: ["integer", "null"] }
        createdAt: { type: string, format: date-time }

    # ── CUSTOMER ────────────────────────────────────────────────────────────
    Customer:
      type: object
      required: [id, name, email, phone, createdAt, updatedAt]
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string }
        phone: { type: string }
        address: { type: ["string", "null"] }
        city: { type: ["string", "null"] }
        state: { type: ["string", "null"] }
        zipCode: { type: ["string", "null"] }
        notes: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    CustomerInput:
      type: object
      required: [name, email, phone]
      properties:
        name: { type: string, minLength: 1 }
        email: { type: string }
        phone: { type: string }
        address: { type: string }
        city: { type: string }
        state: { type: string }
        zipCode: { type: string }
        notes: { type: string }

    CustomerUpdate:
      type: object
      properties:
        name: { type: string }
        email: { type: string }
        phone: { type: string }
        address: { type: string }
        city: { type: string }
        state: { type: string }
        zipCode: { type: string }
        notes: { type: string }

    # ── PROJECT ─────────────────────────────────────────────────────────────
    Project:
      type: object
      required: [id, name, customerId, status, roofType, address, createdAt, updatedAt]
      properties:
        id: { type: integer }
        name: { type: string }
        customerId: { type: integer }
        customerName: { type: ["string", "null"] }
        status: { type: string }
        roofType: { type: string }
        address: { type: string }
        squareFootage: { type: ["number", "null"] }
        startDate: { type: ["string", "null"], format: date }
        endDate: { type: ["string", "null"], format: date }
        assignedCrewId: { type: ["integer", "null"] }
        assignedCrewName: { type: ["string", "null"] }
        contractValue: { type: ["number", "null"] }
        materialCost: { type: ["number", "null"] }
        laborCost: { type: ["number", "null"] }
        notes: { type: ["string", "null"] }
