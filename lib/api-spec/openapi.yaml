  /activity:
    get:
      operationId: getActivityLogs
      tags: [activity]
      parameters:
        - name: leadId
          in: query
          schema: { type: integer }
        - name: projectId
          in: query
          schema: { type: integer }
        - name: limit
          in: query
          schema: { type: integer, default: 20 }
      responses:
        "200":
          description: List of activity logs
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ActivityLog" }

  # ── DASHBOARD ──────────────────────────────────────────────────────────────
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get high-level KPI summary
      responses:
        "200":
          description: Dashboard summary stats
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DashboardSummary" }

  /dashboard/revenue:
    get:
      operationId: getRevenueTimeline
      tags: [dashboard]
      summary: Monthly revenue data for chart
      responses:
        "200":
          description: Revenue timeline
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/RevenueDataPoint" }

  /dashboard/lead-funnel:
    get:
      operationId: getLeadFunnel
      tags: [dashboard]
      summary: Lead counts by pipeline stage
      responses:
        "200":
          description: Lead funnel data
          content:
            application/json:
              schema:
                type: array
