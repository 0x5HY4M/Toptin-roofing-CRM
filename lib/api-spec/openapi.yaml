          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EstimateUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Estimate" }
    delete:
      operationId: deleteEstimate
      tags: [estimates]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Deleted

  # ── INVOICES ───────────────────────────────────────────────────────────────
  /invoices:
    get:
      operationId: getInvoices
      tags: [invoices]
      parameters:
        - name: status
